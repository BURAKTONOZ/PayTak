<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayTak Sanal Evcil Hayvan</title>
    <style>
        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: transparent !important;
            user-select: none; color: white;
        }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.8); z-index: 100; backdrop-filter: blur(5px); transition: opacity 0.5s; }
        h1 { color: #f8fafc; margin-bottom: 10px; font-size: 36px; text-shadow: 0 0 20px rgba(79, 124, 255, 0.5); text-align: center;}
        p { color: #22c7d9; text-align: center; max-width: 600px; line-height: 1.6; font-size: 20px; font-weight: bold; margin-bottom: 30px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* AKILLI WIDGET ANA KUTUSU (Mini hap ve menüyü tutar) */
        #widget-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        /* HAVADA ASILI AÇILIR MENÜ (Artık alttaki hapı aşağı ittirmez!) */
        #expanded-menu {
            position: absolute;
            bottom: 100%; /* Hapın tam üstünde başlar */
            margin-bottom: 15px; /* Hap ile arasındaki boşluk */
            left: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            
            /* Animasyon başlangıç hali (Kapalı) */
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(15px) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        /* Menü Açık Hali */
        #expanded-menu.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* MİNİMAL HAP KAPSÜL (Sabit durur) */
        #mini-pill {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 8px 15px 8px 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: box-shadow 0.2s;
        }
        #mini-pill:hover {
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .drag-handle { 
            cursor: grab; font-size: 22px; color: rgba(255,255,255,0.6); 
            display: flex; align-items: center; justify-content: center; 
            padding: 0 10px; line-height: 1;
        }
        .drag-handle:active { cursor: grabbing; color: white; }
        .drag-handle:hover { color: rgba(255,255,255,0.9); }

        /* MİNİ BARLAR */
        .mini-stat { display: flex; align-items: center; gap: 6px; }
        .mini-stat span { font-size: 16px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
        .mini-bar-bg { width: 45px; height: 8px; background: rgba(0,0,0,0.6); border-radius: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); overflow: hidden; }
        .mini-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease, background 0.4s ease; box-shadow: 0 0 10px rgba(255,255,255,0.3) inset; }

        /* AÇ/KAPAT BUTONU */
        #toggle-btn {
            cursor: pointer; font-size: 14px; padding: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.1); width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; margin-left: 5px;
        }
        #toggle-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
        #toggle-btn:active { transform: scale(0.95); }

        /* BUTONLAR (Izgara İçi) */
        .action-btn { display: flex; justify-content: center; align-items: center; width: 45px; height: 45px; border-radius: 14px; cursor: pointer; font-size: 22px; transition: all 0.2s; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); text-decoration: none; color: white;}
        .action-btn:hover { transform: scale(1.15) translateY(-5px); z-index: 10; background: rgba(255,255,255,0.25); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .action-btn:active { transform: scale(1.05); }

        /* EFEKTLER */
        .emoji-effect { position: absolute; font-size: 60px; pointer-events: none; z-index: 40; opacity: 1; transition: top 1.5s ease-out, opacity 1.5s ease-in; transform: translateX(-50%); filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        
        .dropped-food { position: absolute; font-size: 50px; z-index: 5; transform: translate(-50%, -50%); animation: dropIn 0.5s forwards; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.8)); cursor: grab; }
        .dropped-food:active { cursor: grabbing; }

        @keyframes dropIn { 0% { top: -100px; transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🦆 Sanal Bebek Yükleniyor</h1>
        <p id="loading-text">Lütfen Bekleyin ⏳</p>
    </div>

    <!-- AKILLI WIDGET -->
    <div id="widget-container">
        
        <!-- HAVADA ASILI MENÜ IZGARASI -->
        <div id="expanded-menu">
            <div class="action-btn" onclick="spawnFood('🍔')" title="Hamburger">🍔</div>
            <div class="action-btn" onclick="spawnFood('🍟')" title="Patates">🍟</div>
            <div class="action-btn" onclick="spawnFood('🥦')" title="Sebze">🥦</div>
            <div class="action-btn" onclick="spawnFood('🍉')" title="Karpuz">🍉</div>
            <div class="action-btn" onclick="spawnFood('🍦')" title="Dondurma">🍦</div>
            <div class="action-btn" onclick="spawnFood('☕')" title="Türk Kahvesi (Turbo!)">☕</div>
            <div class="action-btn" onclick="spawnToy('ball')" title="Top">⚽</div>
            <div class="action-btn" onclick="spawnToy('cube')" title="Küp">📦</div>
            <div class="action-btn" onclick="petDuck()" title="Sev">❤️</div>
            <div class="action-btn" onclick="sleepDuck()" title="Uyut">💤</div>
            
            <!-- İNDİRME / GÜNCELLEME BUTONU -->
            <a href="https://github.com/BURAKTONOZ/PayTak/releases/download/v3.0.0/PayTak.exe" class="action-btn" title="Uygulamayı İndir / Güncelle">⬇️</a>
            
            <div class="action-btn" id="btn-close" onclick="window.close()" style="background: rgba(231, 76, 60, 0.6);" title="Kapat">❌</div>
        </div>

        <!-- MİNİMAL HAP (KAPALI DURUM - Sabit) -->
        <div id="mini-pill">
            <div class="drag-handle" title="Ekranın İstediğin Yerine Sürükle">⋮⋮</div>
            
            <div class="mini-stat" title="Açlık">
                <span>🍗</span>
                <div class="mini-bar-bg"><div class="mini-bar-fill" id="bar-hunger"></div></div>
            </div>
            <div class="mini-stat" title="Enerji">
                <span>⚡</span>
                <div class="mini-bar-bg"><div class="mini-bar-fill" id="bar-energy"></div></div>
            </div>
            <div class="mini-stat" title="Mutluluk">
                <span>❤️</span>
                <div class="mini-bar-bg"><div class="mini-bar-fill" id="bar-happiness"></div></div>
            </div>

            <div id="toggle-btn" title="Menüyü Aç/Kapat">🔼</div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // --- IPC (Görünmez Tıklama Ayarları) ---
        let ipcRenderer = null;
        let isElectron = false;
        let currentIgnoreState = true; 

        try {
            ipcRenderer = require('electron').ipcRenderer;
            isElectron = true;
        } catch (e) {}

        if (!isElectron) {
            document.getElementById('btn-close').style.display = 'none';
        }

        // --- AÇILIR/KAPANIR MENÜ SİSTEMİ ---
        const toggleBtn = document.getElementById('toggle-btn');
        const expandedMenu = document.getElementById('expanded-menu');
        let isMenuOpen = false;

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            if(isMenuOpen) {
                expandedMenu.classList.add('show');
                toggleBtn.innerHTML = '🔽';
                toggleBtn.style.background = 'rgba(255,255,255,0.3)';
            } else {
                expandedMenu.classList.remove('show');
                toggleBtn.innerHTML = '🔼';
                toggleBtn.style.background = 'rgba(255,255,255,0.1)';
            }
        }

        function closeMenuIfOpen() {
            if (isMenuOpen) toggleMenu();
        }

        toggleBtn.addEventListener('click', toggleMenu);

        // --- PANEL SÜRÜKLEME SİSTEMİ ---
        const widget = document.getElementById('widget-container');
        const handle = document.querySelector('.drag-handle');
        let isDraggingPanel = false;
        let panelOffset = { x: 0, y: 0 };

        handle.addEventListener('mousedown', (e) => {
            isDraggingPanel = true;
            const rect = widget.getBoundingClientRect();
            widget.style.transform = 'none';
            widget.style.bottom = 'auto'; // Lastik esnemesini kökten engeller
            widget.style.left = rect.left + 'px';
            widget.style.top = rect.top + 'px';
            
            panelOffset.x = e.clientX - rect.left;
            panelOffset.y = e.clientY - rect.top;
        });

        // --- YİYECEK SÜRÜKLEME SİSTEMİ ---
        let draggedFood = null;

        window.addEventListener('mousemove', (e) => {
            if (isDraggingPanel) {
                widget.style.left = (e.clientX - panelOffset.x) + 'px';
                widget.style.top = (e.clientY - panelOffset.y) + 'px';
            }
            
            if (draggedFood) {
                draggedFood.element.style.left = e.clientX + 'px';
                draggedFood.element.style.top = e.clientY + 'px';
                
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ground);
                if (intersects.length > 0) {
                    draggedFood.foodObj.position.copy(intersects[0].point);
                }
            }
        });

        window.addEventListener('mouseup', () => { 
            isDraggingPanel = false; 
            if (draggedFood) {
                draggedFood.element.style.transform = 'translate(-50%, -50%) scale(1)';
                draggedFood = null;
            }
        });

        // --- YENİ MİNİ DURUM BARLARI ---
        let stats = JSON.parse(localStorage.getItem('smartDuckStats')) || { hunger: 80, energy: 100, happiness: 80, weight: 1.0 };
        function saveStats() { localStorage.setItem('smartDuckStats', JSON.stringify(stats)); updateBars(); }

        function updateBars() {
            const clamp = (val) => Math.max(0, Math.min(100, val));
            stats.hunger = clamp(stats.hunger); stats.energy = clamp(stats.energy); stats.happiness = clamp(stats.happiness);
            
            document.getElementById('bar-hunger').style.width = stats.hunger + '%'; 
            document.getElementById('bar-hunger').style.background = stats.hunger < 30 ? '#e74c3c' : '#32d583';
            
            document.getElementById('bar-energy').style.width = stats.energy + '%'; 
            document.getElementById('bar-energy').style.background = stats.energy < 30 ? '#e74c3c' : '#22c7d9'; 
            
            document.getElementById('bar-happiness').style.width = stats.happiness + '%'; 
            document.getElementById('bar-happiness').style.background = stats.happiness < 40 ? '#e74c3c' : '#ff4f8b';
        }

        setInterval(() => {
            if (duckState !== 'sleeping') { stats.hunger -= 0.6; stats.energy -= 0.4; stats.happiness -= 0.2; } 
            else { stats.energy += 4.0; stats.hunger -= 0.1; }
            if (stats.hunger < 30) stats.happiness -= 0.5;
            if (stats.energy <= 0 && duckState !== 'sleeping') sleepDuck();
            saveStats();
        }, 2000);

        // --- 3D SAHNE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 12); camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        document.body.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2); hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); dirLight.position.set(5, 10, 7); dirLight.castShadow = true; scene.add(dirLight);

        const planeGeo = new THREE.PlaneGeometry(1000, 1000);
        const planeMat = new THREE.ShadowMaterial({ opacity: 0.4 }); 
        const ground = new THREE.Mesh(planeGeo, planeMat); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        let duckWrapper = new THREE.Group(); scene.add(duckWrapper);
        let duckModel;
        const BASE_SCALE = 4.5; 
        let mixer, anims = {};
        let currentAction, duckState = 'idle'; 
        let targetPosition = new THREE.Vector3(0, 0, 0);
        
        let normalWalkSpeed = 2.5; let walkSpeed = normalWalkSpeed; let stateTimer = 2.0; 
        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        const foods = []; const toys = []; let currentTargetToy = null;

        function applyWeight() {
            if(!duckModel) return;
            stats.weight = Math.max(0.8, Math.min(stats.weight, 1.8)); 
            duckModel.scale.set(BASE_SCALE * stats.weight, BASE_SCALE, BASE_SCALE * stats.weight);
        }

        const loader = new THREE.GLTFLoader();
        loader.load('duck_baby_-_animated_low_poly.glb', function(gltf) {
            const uiContainer = document.getElementById('ui-container');
            uiContainer.style.opacity = '0'; setTimeout(() => { uiContainer.style.display = 'none'; }, 500);
            updateBars();

            duckModel = gltf.scene; applyWeight(); 
            duckModel.castShadow = true; duckModel.traverse(node => { if (node.isMesh) node.castShadow = true; });
            duckModel.rotation.y = 0; duckWrapper.add(duckModel);

            const clips = gltf.animations;
            if (clips && clips.length > 0) {
                mixer = new THREE.AnimationMixer(duckModel);
                const findAnim = (name) => { const clip = clips.find(c => c.name.toLowerCase().includes(name)); return clip ? mixer.clipAction(clip) : null; };
                anims.idle = findAnim('stand_idle') || findAnim('idle') || mixer.clipAction(clips[0]);
                anims.walk = findAnim('walk') || findAnim('run') || anims.idle;
                anims.eat = findAnim('sit_wash') || findAnim('eat') || anims.idle;
                anims.sleep = findAnim('sleep') || findAnim('sit_idle') || anims.idle;
                anims.happy = findAnim('jump') || findAnim('stand_special') || anims.idle;
                [anims.eat, anims.sleep, anims.happy].forEach(a => { if(a) { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; } });
                currentAction = anims.idle; if(currentAction) currentAction.play();
            }
        });

        function playAnimation(newAction, duration = 0.3) {
            if (!newAction || currentAction === newAction) return;
            newAction.reset().fadeIn(duration).play(); if (currentAction) currentAction.fadeOut(duration); currentAction = newAction;
        }

        function toScreenPosition(vector3) {
            const vector = vector3.clone(); vector.project(camera);
            return { x: (vector.x * 0.5 + 0.5) * window.innerWidth, y: (vector.y * -0.5 + 0.5) * window.innerHeight };
        }

        function create2DEffect(emoji, customPos = null) {
            const el = document.createElement('div'); el.innerText = emoji; el.className = 'emoji-effect';
            let pos = customPos ? toScreenPosition(customPos) : toScreenPosition(duckWrapper.position);
            if(!customPos) pos.y -= 180; 
            el.style.left = (pos.x + (Math.random() * 60 - 30)) + 'px'; el.style.top = pos.y + 'px'; document.body.appendChild(el);
            setTimeout(() => { el.style.top = (pos.y - 200) + 'px'; el.style.opacity = 0; }, 50); setTimeout(() => el.remove(), 1500);
        }

        function updateFoodElements() {
            foods.forEach(food => { 
                if (draggedFood && draggedFood.foodObj === food) return;
                const pos = toScreenPosition(food.position); 
                food.element.style.left = pos.x + 'px'; 
                food.element.style.top = pos.y + 'px'; 
            });
        }

        function getVisibleBounds() {
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const corners = [ new THREE.Vector2(-0.9, 0.9), new THREE.Vector2(0.9, 0.9), new THREE.Vector2(-0.9, -0.9), new THREE.Vector2(0.9, -0.9) ];
            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            corners.forEach(corner => {
                raycaster.setFromCamera(corner, camera); const target = new THREE.Vector3(); raycaster.ray.intersectPlane(plane, target);
                if (target) { if (target.x < minX) minX = target.x; if (target.x > maxX) maxX = target.x; if (target.z < minZ) minZ = target.z; if (target.z > maxZ) maxZ = target.z; }
            });
            if (minX === Infinity) return { xMin: -15, xMax: 15, zMin: -10, zMax: 15 };
            return { xMin: minX, xMax: maxX, zMin: minZ, zMax: maxZ };
        }

        window.spawnFood = function(foodEmoji) {
            closeMenuIfOpen();
            if(foods.length > 5) { const old = foods.shift(); old.element.remove(); }
            const el = document.createElement('div'); el.innerText = foodEmoji; el.className = 'dropped-food'; 
            document.body.appendChild(el);
            
            el.addEventListener('mousedown', (e) => {
                draggedFood = { element: el, foodObj: foods.find(f => f.element === el) };
                el.style.transform = 'translate(-50%, -50%) scale(1.3)';
            });

            const bounds = getVisibleBounds();
            const pos = new THREE.Vector3(bounds.xMin + Math.random() * (bounds.xMax - bounds.xMin), 0, bounds.zMin + Math.random() * (bounds.zMax - bounds.zMin));
            foods.push({ position: pos, element: el, type: foodEmoji });
            
            if((duckState === 'idle' || duckState === 'wandering') && stats.hunger <= 80) duckState = 'wandering'; 
        }

        window.spawnToy = function(type) {
            closeMenuIfOpen();
            if(toys.length >= 3) { const oldToy = toys.shift(); scene.remove(oldToy.mesh); }
            let mesh = type === 'ball' ? 
                new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({color: 0xe74c3c, roughness: 0.3})) : 
                new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0x3498db, roughness: 0.6}));
            const bounds = getVisibleBounds();
            mesh.position.set(bounds.xMin + Math.random() * (bounds.xMax - bounds.xMin), 3, bounds.zMin + Math.random() * (bounds.zMax - bounds.zMin));
            mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
            toys.push({ mesh: mesh, velocity: new THREE.Vector3(0, 0, 0), type: type, lifetime: 20.0 });
        }

        function bounceToy(toyMesh) {
            const toy = toys.find(t => t.mesh === toyMesh);
            if(toy) { toy.velocity.set((Math.random() - 0.5) * 0.4, 0.4, (Math.random() - 0.5) * 0.4); create2DEffect('💨', toy.mesh.position); }
        }

        function explodeToy(toyMesh) {
            const index = toys.findIndex(t => t.mesh === toyMesh);
            if(index > -1) {
                create2DEffect('💥', toys[index].mesh.position); scene.remove(toys[index].mesh); toys.splice(index, 1);
                if (currentTargetToy && currentTargetToy.mesh === toyMesh) { currentTargetToy = null; duckState = 'idle'; }
            }
        }

        window.petDuck = function() {
            closeMenuIfOpen();
            if(!mixer) return; duckState = 'petting'; stats.happiness += 25; saveStats(); playAnimation(anims.happy);
            for(let i=0; i<7; i++) setTimeout(() => create2DEffect('❤️'), i * 150); stateTimer = 2.5; 
        }

        window.sleepDuck = function() {
            closeMenuIfOpen();
            if(!mixer) return; duckState = 'sleeping'; playAnimation(anims.sleep); stateTimer = 10.0; 
            let zzzCount = 0; const sleepInterval = setInterval(() => {
                if(duckState !== 'sleeping') return clearInterval(sleepInterval); create2DEffect('💤'); zzzCount++; if(zzzCount > 9) clearInterval(sleepInterval);
            }, 1000);
        }

        // --- AKILLI FARE RADARI ---
        let mouse3DPos = new THREE.Vector3(999, 0, 999);
        
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground); if (intersects.length > 0) mouse3DPos.copy(intersects[0].point);

            if (isElectron) {
                let isOverUI = !!(event.target.closest('#widget-container') || event.target.closest('.dropped-food') || event.target.closest('.emoji-effect') || event.target.closest('#ui-container'));
                
                let isOver3D = false;
                if (!isOverUI) { 
                    if (duckWrapper && raycaster.intersectObject(duckWrapper, true).length > 0) isOver3D = true;
                    if (toys.length > 0 && raycaster.intersectObjects(toys.map(t => t.mesh)).length > 0) isOver3D = true;
                }

                const isDraggingSomething = isDraggingPanel || draggedFood !== null;
                const shouldIgnore = !(isOverUI || isOver3D || isDraggingSomething);
                
                if (shouldIgnore !== currentIgnoreState) {
                    currentIgnoreState = shouldIgnore;
                    ipcRenderer.send('set-ignore-mouse-events', shouldIgnore);
                }
            }
        });

        window.addEventListener('click', (event) => {
            if (event.detail > 1 || event.target.closest('.action-btn') || event.target.closest('#toggle-btn') || event.target.closest('.drag-handle')) return; 
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const toyIntersects = raycaster.intersectObjects(toys.map(t => t.mesh));
            if (toyIntersects.length > 0) { bounceToy(toyIntersects[0].object); return; }
        });

        window.addEventListener('dblclick', (event) => {
            if(!mixer || event.target.closest('#widget-container')) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const duckIntersects = raycaster.intersectObject(duckWrapper, true);
            if (duckIntersects.length > 0) { window.petDuck(); return; }

            const toyIntersects = raycaster.intersectObjects(toys.map(t => t.mesh));
            if (toyIntersects.length > 0) { explodeToy(toyIntersects[0].object); return; }
        });

        const clock = new THREE.Clock(); let targetFoodIndex = -1;

        function animate() {
            requestAnimationFrame(animate); const delta = clock.getDelta();
            if (mixer) mixer.update(delta); updateFoodElements(); 
            const bounds = getVisibleBounds();

            for (let i = toys.length - 1; i >= 0; i--) {
                let toy = toys[i]; toy.lifetime -= delta;
                if (toy.lifetime <= 0) {
                    create2DEffect('💨', toy.mesh.position); scene.remove(toy.mesh); toys.splice(i, 1);
                    if (currentTargetToy && currentTargetToy.mesh === toy.mesh) { currentTargetToy = null; duckState = 'idle'; }
                    continue;
                }
                toy.mesh.position.add(toy.velocity); toy.velocity.x *= 0.92; toy.velocity.z *= 0.92;
                const radius = toy.type === 'ball' ? 0.35 : 0.3;
                if (toy.mesh.position.y > radius) toy.velocity.y -= 0.015; else { toy.mesh.position.y = radius; toy.velocity.y *= -0.5; }

                if(toy.mesh.position.x < bounds.xMin) { toy.mesh.position.x = bounds.xMin; toy.velocity.x *= -0.8; }
                if(toy.mesh.position.x > bounds.xMax) { toy.mesh.position.x = bounds.xMax; toy.velocity.x *= -0.8; }
                if(toy.mesh.position.z < bounds.zMin) { toy.mesh.position.z = bounds.zMin; toy.velocity.z *= -0.8; }
                if(toy.mesh.position.z > bounds.zMax) { toy.mesh.position.z = bounds.zMax; toy.velocity.z *= -0.8; }

                if (duckWrapper) {
                    const dist = duckWrapper.position.distanceTo(toy.mesh.position);
                    if (dist < 1.4) { 
                        const pushDir = new THREE.Vector3().subVectors(toy.mesh.position, duckWrapper.position).normalize();
                        toy.velocity.x += pushDir.x * 0.05; toy.velocity.z += pushDir.z * 0.05;
                        if(duckState === 'chasing_toy' && currentTargetToy === toy) {
                            duckState = 'playing'; stateTimer = 1.5; playAnimation(anims.happy);
                            toy.velocity.add(pushDir.multiplyScalar(0.2)); toy.velocity.y += 0.2; 
                            stats.happiness += 5; stats.energy -= 2; applyWeight(); saveStats(); create2DEffect('🎵', toy.mesh.position);
                        }
                    }
                }
                if (toy.type === 'ball') { toy.mesh.rotation.x += toy.velocity.z; toy.mesh.rotation.z -= toy.velocity.x; }
            }

            if (duckWrapper && mixer) {
                if (duckState === 'idle' || duckState === 'wandering') {
                    const distToMouse = duckWrapper.position.distanceTo(mouse3DPos);
                    if (distToMouse < 4.0) { 
                        if (stats.happiness < 40) {
                            const escapeDir = new THREE.Vector3().subVectors(duckWrapper.position, mouse3DPos).normalize();
                            targetPosition.copy(duckWrapper.position).add(escapeDir.multiplyScalar(5)); walkSpeed = 4.0; duckState = 'wandering';
                        } else if (stats.happiness >= 70 && duckState !== 'chasing_food') {
                            targetPosition.copy(mouse3DPos); walkSpeed = 2.0; duckState = 'wandering';
                        }
                    }
                }

                switch(duckState) {
                    case 'idle':
                        playAnimation(anims.idle); walkSpeed = normalWalkSpeed; stateTimer -= delta;
                        if (stateTimer <= 0) {
                            if (foods.length > 0 && stats.hunger <= 80) { duckState = 'wandering'; } 
                            else if (toys.length > 0 && stats.happiness >= 50 && Math.random() < 0.4) {
                                currentTargetToy = toys[Math.floor(Math.random() * toys.length)]; duckState = 'chasing_toy';
                            } else {
                                targetPosition.set(bounds.xMin + Math.random() * (bounds.xMax - bounds.xMin), 0, bounds.zMin + Math.random() * (bounds.zMax - bounds.zMin));
                                duckState = 'wandering';
                            }
                        }
                        break;
                    case 'wandering': case 'chasing_food': case 'chasing_toy':
                        let currentTarget = targetPosition;
                        if (foods.length > 0 && stats.hunger <= 80) {
                            let closestDist = Infinity;
                            foods.forEach((f, index) => { const dist = duckWrapper.position.distanceTo(f.position); if (dist < closestDist) { closestDist = dist; targetFoodIndex = index; } });
                            currentTarget = foods[targetFoodIndex].position; duckState = 'chasing_food';
                        } else if (duckState === 'chasing_food') { duckState = 'wandering'; }

                        if (duckState === 'chasing_toy' && currentTargetToy) currentTarget = currentTargetToy.mesh.position;

                        const direction = new THREE.Vector3().subVectors(currentTarget, duckWrapper.position);
                        const distance = direction.length();

                        if (distance > 0.4) {
                            direction.normalize(); duckWrapper.rotation.y = Math.atan2(direction.x, direction.z); 
                            duckWrapper.position.add(direction.multiplyScalar(walkSpeed * delta)); playAnimation(anims.walk);
                            stats.energy -= 0.05 * delta; stats.weight -= 0.005 * delta; applyWeight();
                        } else {
                            if (duckState === 'chasing_food' && targetFoodIndex !== -1) {
                                duckState = 'eating'; stateTimer = 2.5; playAnimation(anims.eat);
                                
                                const eatenFood = foods[targetFoodIndex];
                                if (eatenFood.type === '☕') {
                                    stats.energy = 100; stats.happiness += 20; walkSpeed = 6.0; 
                                    setTimeout(() => { walkSpeed = normalWalkSpeed; }, 10000); 
                                    create2DEffect('⚡');
                                } else {
                                    stats.hunger += 25; stats.weight += 0.08;
                                }

                                eatenFood.element.remove(); foods.splice(targetFoodIndex, 1); targetFoodIndex = -1;
                            } else if (duckState !== 'chasing_toy') { duckState = 'idle'; stateTimer = 1 + Math.random() * 3; }
                        }
                        break;
                    case 'eating':
                        stateTimer -= delta;
                        if(stateTimer <= 0.5 && stateTimer + delta > 0.5) {
                            create2DEffect('❤️'); create2DEffect('✨'); applyWeight(); saveStats();
                        }
                        if (stateTimer <= 0) { duckState = 'idle'; stateTimer = 1.0; } break;
                    case 'playing': case 'sleeping': case 'petting':
                        stateTimer -= delta; if (stateTimer <= 0) { duckState = 'idle'; stateTimer = 1.0; } break;
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
