name: Build Portable EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v3

      - name: Node.js Kur (Bulutta)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Gerekli Paketleri Yükle
        run: npm install

      - name: EXE Dosyasını Oluştur
        run: npm run build

      - name: EXE'yi İndirilebilir Yap
        uses: actions/upload-artifact@v3
        with:
          name: Sanal-Ordek-Oyun
          path: dist/*.exe
